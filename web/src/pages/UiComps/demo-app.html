<!doctype html>
<!-- The "generated app" the /ui-comps preview scenarios load. Vite serves it in
     dev only; nothing imports it, so production builds never include it. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Habits</title>
    <style>
      :root { color-scheme: dark; --bg: #0e1013; --card: #171a1f; --line: #262a31; --ink: #e8eaed; --mute: #8b919a; --green: #34d399; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, sans-serif; }
      main { max-width: 560px; margin: 0 auto; padding: 40px 20px; }
      h1 { margin: 0 0 4px; font-size: 28px; }
      p { margin: 0 0 24px; color: var(--mute); }
      ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
      li { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); }
      li span { flex: 1; }
      .streak { color: var(--green); font-variant-numeric: tabular-nums; }
      .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 28px; }
      .grid i { aspect-ratio: 1; border-radius: 6px; background: var(--line); }
      .grid i.on { background: var(--green); }
    </style>
  </head>
  <body>
    <main>
      <h1>Habits</h1>
      <p>Tick one off to grow its streak.</p>
      <ul>
        <li>✅ <span>Morning walk</span><b class="streak">12 days</b></li>
        <li>✅ <span>Read 20 pages</span><b class="streak">5 days</b></li>
        <li>⬜ <span>No phone after 10pm</span><b class="streak">0 days</b></li>
      </ul>
      <div class="grid"><i class="on"></i><i class="on"></i><i></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i></div>
    </main>
    <script>
      // Speak the same postMessage protocol as a real sandbox's preview runtime
      // (health monitor + visual-edit error relay), so PreviewPane takes its
      // real code paths. ?state=build-error | crash picks the failure.
      const state = new URLSearchParams(location.search).get("state");
      const post = (message) => parent.postMessage(message, location.origin);
      function report() {
        if (state === "build-error") {
          post({
            source: "tau-visual-edit",
            type: "tau:error",
            message: '[plugin:vite:react-babel] src/App.tsx: Unexpected token, expected "," (7:6)',
            file: "src/App.tsx",
            frame: '  5 |     <main className="mx-auto max-w-xl p-6">\n  6 |       <h1>Habits</h1>\n> 7 |       <HabitList\n    |       ^\n  8 |     </main>',
          });
        }
        if (state === "crash") {
          post({
            source: "tau-preview-health",
            type: "errors",
            path: "/",
            errors: [{ kind: "error", message: "TypeError: Cannot read properties of undefined (reading 'map')", at: "src/components/HabitList.tsx:4:18" }],
          });
          post({ source: "tau-preview-health", state: "failed", transient: false });
          return;
        }
        post({ source: "tau-preview-health", state: "loaded" });
      }
      window.addEventListener("message", (event) => {
        if (event.data && event.data.type === "tau:preview-probe") report();
      });
      report();
    </script>
  </body>
</html>
